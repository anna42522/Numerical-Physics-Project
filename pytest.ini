[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
markers =
    week1: Week 1 foundational tests (cat states, parity, truncation)
    week2: Week 2 MCWF trajectory engine tests (RK4, jumps, parity flips)
    week3: Week 3 Lindblad validation and convergence tests (1/sqrt(M))
    week4: Week 4 scaling and dephasing tests (tau_dec vs alpha)
    week5: Week 5 end-to-end tests and visual generation
    slow: Tests that run multiple trajectories or sweeps
    norm: Tests that check normalization of states
